name: Portable Core

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  swift:
    name: Swift 6.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.0"
      - name: Validate bundled Xcode Swift 6.0 toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          xcodebuild -version
          swift --version
      - name: Run portable Core gate on Linux
        if: runner.os == 'Linux'
        run: scripts/check-portable-core.sh
      - name: Run portable Core gate with Xcode 16.0
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: scripts/check-portable-core.sh

  contracts:
    name: TypeSpec contract drift
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check

  macos-library:
    name: macOS Library + audio adapters / Swift 6.0
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bundled Xcode Swift 6.0 toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test macOS Infrastructure, audio, and Presentation
        run: swift test --package-path Packages/AudoraMac --parallel
      - name: Validate package document declaration
        run: plutil -lint audora/Info.plist
      - name: Build Debug application
        run: >-
          xcodebuild -project audora.xcodeproj -scheme Audora
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath '${{ runner.temp }}/audora-debug'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Release application
        run: >-
          xcodebuild -project audora.xcodeproj -scheme Audora
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -derivedDataPath '${{ runner.temp }}/audora-release'
          CODE_SIGNING_ALLOWED=NO build
